[package]
name = "muse-patch-manager"
version = "1.0.2"
description = "Moog Muse Patch Manager"
authors = ["Joel Wickard"]
license = "MIT"
edition = "2021"

[lib]
name = "moog_muse_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
zip = "0.6"
walkdir = "2.4"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
